plugins { id "com.android.application" }

android {
    namespace "us.ndex.solring"
    compileSdk 35
    defaultConfig {
        applicationId "us.ndex.solring"
        minSdk 26          // adaptive icons only, no PNG fallbacks to ship
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
