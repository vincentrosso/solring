<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#241b4d">
<title>Beatrix</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg:#faf6ee; --panel:#fffdf8; --ink:#1d1b2f; --dim:#6b6880; --line:#e8e1d3;
  --gold:#a86d00; --sun:#ffb81c; --gold-soft:#fdeec6; --paul:#2b2166; --paul-ink:#fff;
  --kat:#e3f3ec; --kat-ink:#14422f; --held:#fff4d1; --note:#efeaf9; --bad:#b3372b; --ok:#27714a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#141127; --panel:#1e1a38; --ink:#efecf8; --dim:#a29dbb; --line:#332d55;
    --gold:#ffc94a; --sun:#ffb81c; --gold-soft:#3b3010; --paul:#4a3fb0; --paul-ink:#fff;
    --kat:#1b3a2d; --kat-ink:#cfeedd; --held:#3b3010; --note:#2c2550; --bad:#f09283; --ok:#7fd0a3;
  }
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; }
button.primary { background:var(--gold); border-color:var(--gold); color:#14121c; font-weight:600; }
button.quiet { border-color:transparent; background:none; color:var(--dim); padding:4px 8px; }
button:disabled { opacity:.5; cursor:default; }
textarea, input[type=text], input[type=password], input[type=date] {
  width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px;
}
textarea { resize:none; }
[hidden] { display:none !important; }

#app { height:100dvh; display:flex; flex-direction:column; max-width:1180px; margin:0 auto; }
header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:18px; margin:0; letter-spacing:.02em; display:flex; align-items:center; gap:8px; }
.ring { width:30px; height:30px; display:inline-block; }
.who { color:var(--dim); font-size:13px; }
.spacer { flex:1; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; border-radius:0; background:none; padding:5px 10px; font-size:13px; }
.seg button.on { background:var(--gold); color:#14121c; font-weight:600; }

main { flex:1; min-height:0; display:grid; grid-template-columns:1fr; }
main.two { grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
section { min-height:0; display:flex; flex-direction:column; }
#tasksPane { border-left:1px solid var(--line); }
.scroll { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }

.msg { max-width:82%; padding:8px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
.msg .meta { display:block; font-size:11px; color:var(--dim); margin-bottom:2px; }
.msg.mine { align-self:flex-end; }
.msg.paul { background:var(--paul); color:var(--paul-ink); border-color:transparent; }
.msg.paul .meta { color:rgba(255,255,255,.7); }
.msg.katherine { background:var(--kat); color:var(--kat-ink); border-color:transparent; }
.msg.vincent { background:var(--gold-soft); border-color:var(--gold); }
.msg .x, .task .x { float:right; margin-left:8px; font-size:12px; padding:0 6px; }
.msg.note { background:var(--note); border-style:dashed; }
.msg.held { background:var(--held); border-color:var(--gold); max-width:100%; align-self:stretch; }
.msg.held textarea { margin:6px 0; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.status { align-self:center; font-size:13px; color:var(--dim); padding:4px 0; }
.empty { color:var(--dim); text-align:center; margin:auto; padding:24px; }

.composer { border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
.composer .col { flex:1; display:flex; flex-direction:column; gap:6px; }
.composer label { font-size:13px; color:var(--dim); }

.task { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.task.done { opacity:.65; }
.task h3 { font-size:15px; margin:0 0 2px; }
.task p { margin:2px 0; font-size:14px; color:var(--dim); white-space:pre-wrap; overflow-wrap:anywhere; }
.task .note { color:var(--ink); }
.pill { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--gold-soft); color:var(--gold); font-weight:600; }
.pill.doing { background:var(--kat); color:var(--kat-ink); }
.pill.done { background:none; border:1px solid var(--line); color:var(--dim); }
.pill.late { background:none; border:1px solid var(--bad); color:var(--bad); }
.task .row { margin-top:8px; }
.task .row button { font-size:13px; padding:4px 10px; }
.addtask { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; }
.addtask input[type=date] { width:auto; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0; padding:10px 16px 0; }

#login { margin:auto; width:min(340px, 100% - 32px); display:flex; flex-direction:column; gap:10px; text-align:center; }
#login .ring { width:120px; height:120px; margin:0 auto 6px; }
#err { color:var(--bad); font-size:14px; min-height:20px; }

@media (max-width:820px) {
  main.two { grid-template-columns:1fr; }
  #tasksPane, #calPane, #morePane { border-left:0; }
  .msg { max-width:90%; }
}

#seats { display:flex; flex-direction:column; gap:10px; }
#seats button { padding:14px; font-size:18px; }
#devices { display:flex; flex-direction:column; gap:8px; }
#devices h2 { padding:0; }
.dev { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:9px 12px; font-size:14px; }
.dev.pending { border-color:var(--sun); background:var(--held); }
.dev .row { margin-top:6px; }
.dev .row button { font-size:13px; padding:4px 10px; }
/* Top-level menu: always on screen, four places to go */
#nav { display:flex; background:var(--panel); border-top:1px solid var(--line); padding:4px 6px calc(4px + env(safe-area-inset-bottom)); }
#nav button { flex:1; border:0; background:none; border-radius:12px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--dim); font-size:11px; }
#nav button b { font-size:20px; line-height:1.1; font-weight:400; filter:grayscale(1); opacity:.7; }
#nav button.on { color:var(--sun); font-weight:600; }
#nav button.on b { filter:none; opacity:1; }
.composer, .addtask { padding-bottom:10px; }
main.two section { display:none; }
main.two section.show { display:flex; }
@media (min-width:821px) { main.two #chatPane { display:flex; } }   /* wide screen: chat always on the left */
#calPane, #morePane { border-left:1px solid var(--line); }
@media (min-width:821px) { main.two #chatPane.show ~ #tasksPane { display:flex; } }   /* wide screen on Chat: requests sit beside it */
.menu { display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 14px; color:var(--ink); text-decoration:none; font-size:16px; }
#out { color:var(--bad); }
.calbar { display:flex; align-items:center; gap:8px; padding:10px 16px 4px; }
.calbar h2 { flex:1; padding:0; font-size:15px; color:var(--ink); text-transform:none; letter-spacing:0; }
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding:2px 12px; }
#calDow span { text-align:center; font-size:11px; color:var(--dim); }
.day { aspect-ratio:1/0.82; border:1px solid transparent; border-radius:12px; background:none; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:15px; }
.day.out { color:var(--dim); opacity:.45; }
.day.today { border-color:var(--sun); }
.day.sel { background:var(--sun); color:#1d1b2f; font-weight:600; }
.day i { width:6px; height:6px; border-radius:50%; background:var(--sun); }
.day i.done { background:var(--dim); }
.day.sel i { background:#1d1b2f; }
.day i.none { visibility:hidden; }
/* Beatrix look */
header h1, #login h1 { font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight:600; letter-spacing:0; }
header h1 { font-size:21px; }
#login h1 { font-size:34px; }
header { background:var(--panel); }
button { border-radius:999px; }
button.primary, .seg button.on { background:var(--sun); border-color:var(--sun); color:#1d1b2f; }
.seg { border-radius:999px; }
textarea, input[type=text], input[type=password], input[type=date] { border-radius:14px; }
textarea:focus, input:focus { outline:2px solid var(--sun); outline-offset:1px; border-color:transparent; }
.msg { border-radius:18px 18px 18px 6px; padding:9px 14px; }
.msg.mine { border-radius:18px 18px 6px 18px; }
.msg.held { border-radius:16px; border-color:var(--sun); }
.task { border-radius:16px; }
.task h3 { font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size:17px; font-weight:600; }
.composer, .addtask { background:var(--panel); }
#login { background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:32px 26px; }
</style>
</head>
<body>
<div id="app">
  <div id="login" hidden>
    <img class="ring" src="logo.svg" alt="">
    <h1 style="margin:0">Beatrix</h1>
    <div class="who" id="hello">Who's this?</div>
    <div id="seats">
      <button class="primary" data-seat="paul">I'm Paul</button>
      <button class="primary" data-seat="katherine">I'm Katherine</button>
    </div>
    <div id="err"></div>
    <a class="who" href="/about/">What is this?</a>
  </div>

  <header id="top" hidden>
    <h1><img class="ring" src="logo.svg" alt="">Beatrix</h1>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <span class="seg" id="modes" hidden title="Who answers Paul">
      <button data-mode="auto" title="Beatrix answers Paul straight away; you watch">Auto</button>
      <button data-mode="review" title="Beatrix drafts; nothing reaches Paul until you approve">Review</button>
      <button data-mode="off" title="Beatrix stays silent; you answer">Off</button>
    </span>
  </header>

  <main id="main" class="two" hidden>
    <section id="chatPane" class="show">
      <div class="scroll" id="feed"></div>
      <div class="composer">
        <div class="col">
          <textarea id="box" rows="2" placeholder="Message"></textarea>
          <label id="privWrap" hidden><input type="checkbox" id="priv"> Private note (Paul never sees it)</label>
        </div>
        <button class="primary" id="send">Send</button>
      </div>
    </section>
    <section id="tasksPane">
      <h2 id="tasksHead">Tasks</h2>
      <div class="scroll" id="tasks"></div>
      <div class="addtask">
        <input type="text" id="newTask" placeholder="Add a task" maxlength="140">
        <input type="date" id="newDue" aria-label="Due date">
        <button id="addTask">Add</button>
      </div>
    </section>
    <section id="calPane">
      <div class="calbar">
        <button id="calPrev" aria-label="Previous month">&lsaquo;</button>
        <h2 id="calTitle"></h2>
        <button id="calToday">Today</button>
        <button id="calNext" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="calgrid" id="calDow"></div>
      <div class="calgrid" id="calGrid"></div>
      <h2 id="calDayHead"></h2>
      <div class="scroll" id="calList"></div>
      <div class="addtask">
        <input type="text" id="calNew" placeholder="Add for this day" maxlength="140">
        <button id="calAdd">Add</button>
      </div>
    </section>
    <section id="morePane">
      <div class="scroll">
        <div class="dev" id="meCard"></div>
        <div class="dev" id="usage" hidden></div>
        <div id="devices" hidden></div>
        <a class="menu" href="/about/">About Beatrix</a>
        <a class="menu" href="/about/#privacy">Privacy</a>
        <a class="menu" href="/about/#support">Help</a>
        <button class="menu" id="wipe" hidden title="Delete every message and task">Wipe all</button>
        <button class="menu" id="out">Sign out</button>
      </div>
    </section>
  </main>
  <nav id="nav" hidden>
    <button data-tab="chatPane" class="on"><b>&#x1F4AC;</b><span>Chat</span></button>
    <button data-tab="tasksPane" id="tasksTab"><b>&#x2611;&#xFE0F;</b><span id="tasksLabel">Requests</span></button>
    <button data-tab="calPane"><b>&#x1F4C5;</b><span>Calendar</span></button>
    <button data-tab="morePane"><b>&#x2630;</b><span id="moreLabel">More</span></button>
  </nav>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
// No sign-in screen to fill in: this browser or app makes its own random token once and keeps it.
let code = store.get('solring-code') || '';   // only the moderator's private link sets this
let device = store.get('beatrix-device');
if (!device) {
  device = [...crypto.getRandomValues(new Uint8Array(24))].map((b) => b.toString(16).padStart(2, '0')).join('');
  store.set('beatrix-device', device);
}
let S = null;          // last full state
let rev = '';
let timer = null;
let dirty = false;     // a state arrived while Katherine was typing in the feed/tasks

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids) if (kid != null && kid !== false) n.append(kid);
  return n;
}

async function api(path, body) {
  const res = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { authorization: 'Bearer ' + (code || device), ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    const info = await res.json().catch(() => ({}));
    if (code) { code = ''; store.del('solring-code'); return api(path, body); }   // stale code: carry on as this device
    showLogin(info);
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'request failed');
  return data;
}

function ago(iso) {
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
const clock = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const NAMES = { paul: 'Paul', assistant: 'Beatrix', katherine: 'Katherine', vincent: 'Moderator' };
const ME = { paul: 'paul', katherine: 'katherine', admin: 'vincent' };
const staff = () => S.role === 'katherine' || S.role === 'admin';

// Shown only until this device has a seat: one tap on a name, nothing to type.
function showLogin(info) {
  S = null; rev = '';
  $('login').hidden = false; $('top').hidden = true; $('main').hidden = true; $('nav').hidden = true;
  $('seats').hidden = Boolean(info.waiting || info.removed);
  $('hello').textContent = info.removed ? 'This device is no longer signed in.'
    : info.waiting ? `Hi ${NAMES[info.waiting]}. One moment: getting this device ready.`
    : "Who's this?";
}

async function poll() {
  clearTimeout(timer);
  try {
    const data = await api('state' + (rev ? '?rev=' + encodeURIComponent(rev) : ''));
    if (data.unchanged && S) { S.kat_seen = data.kat_seen; S.mode = data.mode; renderHeader(); }
    else { S = data; rev = data.rev; render(); }
  } catch (err) { /* not let in yet, or offline: keep trying */ }
  timer = setTimeout(poll, document.hidden ? 20000 : 4000);
}

function editing() {
  const a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && (a.closest('#feed') || a.closest('#tasks') || a.closest('#calList'));
}

function renderHeader() {
  const kat = staff();
  const admin = S.role === 'admin';
  $('who').textContent = admin ? 'Moderator · Katherine was here ' + ago(S.kat_seen)
    : kat ? 'Katherine · PA for Paul' : 'Katherine was here ' + ago(S.kat_seen);
  $('wipe').hidden = !admin; $('usage').hidden = !admin;
  $('meCard').textContent = admin ? 'Signed in as moderator.' : `Signed in as ${NAMES[S.role]} on this device.` + (kat ? '' : ' Katherine was here ' + ago(S.kat_seen) + '.');
  if (admin && S.ai_cap) $('usage').textContent = `Beatrix replies today: ${S.ai_today}/${S.ai_cap}`;
  $('modes').hidden = !kat;
  for (const b of $('modes').children) b.classList.toggle('on', b.dataset.mode === S.mode);
  const open = (S.tasks || []).filter((t) => t.status !== 'done').length;
  const asking = (S.devices || []).filter((d) => d.status === 'pending').length;
  $('tasksLabel').textContent = (kat ? 'Tasks' : 'Requests') + (open ? ' (' + open + ')' : '');
  $('moreLabel').textContent = 'More' + (asking ? ' (' + asking + ')' : '');
}

function render() {
  $('login').hidden = true; $('top').hidden = false; $('main').hidden = false; $('nav').hidden = false;
  renderHeader();
  if (editing()) { dirty = true; return; }
  dirty = false;
  const kat = staff();
  $('privWrap').hidden = !kat;
  $('box').placeholder = S.role === 'admin' ? 'Write to Paul as Beatrix (he will not see it was you)' : kat ? 'Write to Paul as yourself' : 'Ask Beatrix anything, or say what you need done';
  $('tasksHead').textContent = kat ? 'Tasks for you' : 'Your requests';
  $('newTask').placeholder = kat ? 'Add a task' : 'Ask Katherine for something';

  const feed = $('feed');
  const pinned = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  feed.replaceChildren();
  if (!S.messages.length) feed.append(el('div', { class: 'empty' }, kat ? 'Nothing from Paul yet.' : 'Say what you need. Katherine sees everything here.'));
  for (const m of S.messages) feed.append(m.status === 'held' ? draftCard(m) : bubble(m));
  if (!kat) {
    const last = S.messages[S.messages.length - 1];
    if (S.held) feed.append(el('div', { class: 'status' }, 'Beatrix is thinking…'));
    else if (last && last.author === 'paul' && Date.now() - Date.parse(last.created_at) < 60000 && S.mode !== 'off')
      feed.append(el('div', { class: 'status' }, 'Beatrix is thinking…'));
    else if (last && last.author === 'paul' && S.mode === 'off')
      feed.append(el('div', { class: 'status' }, 'Sent to Katherine.'));
  }
  if (pinned) feed.scrollTop = feed.scrollHeight;

  renderDevices();

  const list = $('tasks');
  list.replaceChildren();
  if (!S.tasks.length) list.append(el('div', { class: 'empty' }, kat ? 'No open tasks.' : 'Nothing asked for yet.'));
  for (const t of S.tasks) list.append(taskCard(t, kat));
  renderCal();
}

// Calendar: every request or task that has a date, on a month grid. Tap a day to see it and add to it.
const ymd = (d) => d.toLocaleDateString('en-CA');
let calSel = ymd(new Date());
let calMonth = calSel.slice(0, 7);
function renderCal() {
  if (!S) return;
  const kat = staff();
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  $('calTitle').textContent = first.toLocaleDateString([], { month: 'long', year: 'numeric' });
  if (!$('calDow').children.length) for (const d of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) $('calDow').append(el('span', {}, d));
  const byDay = {};
  for (const t of S.tasks) if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t);
  const today = ymd(new Date());
  const grid = $('calGrid');
  grid.replaceChildren();
  const start = new Date(y, m - 1, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = ymd(d);
    const items = byDay[key] || [];
    const open = items.some((t) => t.status !== 'done');
    grid.append(el('button', { class: 'day' + (d.getMonth() !== m - 1 ? ' out' : '') + (key === today ? ' today' : '') + (key === calSel ? ' sel' : ''),
      'aria-label': d.toDateString() + (items.length ? ', ' + items.length + ' items' : ''),
      onclick: () => { calSel = key; calMonth = key.slice(0, 7); renderCal(); } },
      String(d.getDate()), el('i', { class: items.length ? (open ? '' : 'done') : 'none' })));
  }
  const sel = new Date(calSel + 'T12:00:00');
  const nice = sel.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  $('calDayHead').textContent = calSel === today ? 'Today \u00b7 ' + nice : nice;
  $('calNew').placeholder = (kat ? 'Add a task for ' : 'Ask for something on ') + sel.toLocaleDateString([], { month: 'short', day: 'numeric' });
  const list = $('calList');
  list.replaceChildren();
  const items = byDay[calSel] || [];
  if (!items.length) list.append(el('div', { class: 'empty' }, 'Nothing on this day.'));
  for (const t of items) list.append(taskCard(t, kat));
}
function calStep(n) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  calMonth = ymd(d).slice(0, 7);
  renderCal();
}

// Admin only: who is signed in on what, and one-tap answers for a device asking to get in.
function renderDevices() {
  const box = $('devices');
  box.hidden = S.role !== 'admin';
  if (box.hidden) return;
  const act = (path, body) => async () => { try { await api(path, body); await poll(); } catch {} };
  box.replaceChildren(el('h2', {}, 'Devices'),
    el('div', { class: 'dev' },
      S.enroll_until ? `A new device gets a free seat by itself until ${clock(S.enroll_until)}.` : 'A new device waits for your OK.',
      el('div', { class: 'row' }, S.enroll_until
        ? el('button', { onclick: act('admin/enroll', { hours: 0 }) }, 'Stop now')
        : el('button', { onclick: act('admin/enroll', { hours: 72 }) }, 'Let new devices in for 3 days'))));
  for (const d of S.devices || []) {
    const pending = d.status === 'pending';
    box.append(el('div', { class: 'dev' + (pending ? ' pending' : '') },
      pending ? `${d.label} wants in as ${NAMES[d.role]} \u00b7 ${ago(d.created_at)}` : `${NAMES[d.role]} \u00b7 ${d.label} \u00b7 seen ${ago(d.last_seen)}`,
      el('div', { class: 'row' },
        pending ? el('button', { class: 'primary', onclick: act('admin/device', { id: d.id, action: 'allow', role: 'paul' }) }, 'Allow as Paul') : null,
        pending ? el('button', { class: 'primary', onclick: act('admin/device', { id: d.id, action: 'allow', role: 'katherine' }) }, 'Allow as Katherine') : null,
        el('button', { class: 'quiet', onclick: act('admin/device', { id: d.id, action: 'remove' }) }, pending ? 'Deny' : 'Remove'))));
  }
}

function bubble(m) {
  const mine = m.author === ME[S.role] || (S.role === 'admin' && m.edited === 2);
  const tag = m.private ? 'Private note' : NAMES[m.author] + (m.edited === 2 ? ' · your hand' : m.edited ? ' · edited by Katherine' : '');
  return el('div', { class: `msg ${m.private ? 'note' : m.author}${mine ? ' mine' : ''}` },
    delBtn('message', m.id), el('span', { class: 'meta' }, `${tag} · ${clock(m.created_at)}`), m.body);
}

// Admin only: two clicks to delete one message or task.
function delBtn(kind, id) {
  if (S.role !== 'admin') return null;
  return el('button', { class: 'quiet x', title: 'Delete', onclick: async (e) => {
    if (e.target.textContent !== 'Sure?') { e.target.textContent = 'Sure?'; return; }
    try { await api('admin/delete', { kind, id }); await poll(); } catch {}
  } }, '×');
}

function draftCard(m) {
  const ta = el('textarea', { rows: '3' });
  ta.value = m.body;
  const act = (action) => async (e) => {
    e.target.disabled = true;
    try { await api('draft', { id: m.id, action, body: ta.value }); ta.blur(); await poll(); }
    catch (err) { e.target.disabled = false; }
  };
  return el('div', { class: 'msg held' },
    el('span', { class: 'meta' }, 'Beatrix drafted this · Paul has not seen it'), ta,
    el('div', { class: 'row' },
      el('button', { class: 'primary', onclick: act('approve') }, 'Send to Paul'),
      el('button', { onclick: act('discard') }, 'Discard')));
}

function taskCard(t, kat) {
  const today = new Date().toLocaleDateString('en-CA');
  const late = t.due && t.status !== 'done' && t.due < today;
  const card = el('div', { class: 'task' + (t.status === 'done' ? ' done' : '') },
    delBtn('task', t.id),
    el('div', { class: 'row' },
      el('span', { class: 'pill ' + t.status }, t.status === 'doing' ? 'in progress' : t.status),
      t.due ? el('span', { class: 'pill ' + (late ? 'late' : 'done') }, (late ? 'overdue ' : 'due ') + t.due) : null,
      el('span', { class: 'who' }, 'from ' + NAMES[t.created_by] + ' · ' + ago(t.created_at))),
    el('h3', {}, t.title),
    t.detail && t.detail !== t.title ? el('p', {}, t.detail) : null,
    t.note ? el('p', { class: 'note' }, 'Katherine: ' + t.note) : null);
  if (!kat || t.status === 'done') {
    if (kat) card.append(el('div', { class: 'row' }, el('button', { onclick: () => setTask(t.id, { status: 'open' }) }, 'Reopen')));
    return card;
  }
  const note = el('input', { type: 'text', placeholder: 'Note for Paul (optional)', maxlength: '2000' });
  note.value = t.note || '';
  card.append(note, el('div', { class: 'row' },
    t.status === 'open' ? el('button', { onclick: () => setTask(t.id, { status: 'doing', note: note.value }) }, 'Start') : null,
    el('button', { class: 'primary', onclick: () => setTask(t.id, { status: 'done', note: note.value }) }, 'Done'),
    el('button', { class: 'quiet', onclick: () => setTask(t.id, { status: 'dropped' }) }, 'Drop')));
  return card;
}

async function setTask(id, change) {
  try { await api('task', { id, ...change }); if (document.activeElement) document.activeElement.blur(); await poll(); } catch {}
}

async function send() {
  const box = $('box');
  const body = box.value.trim();
  if (!body) return;
  $('send').disabled = true;
  try {
    await api('message', { body, private: $('priv').checked });
    box.value = ''; $('priv').checked = false;
    const feed = $('feed'); feed.scrollTop = feed.scrollHeight;
    await poll();
    feed.scrollTop = feed.scrollHeight;
  } catch {} finally { $('send').disabled = false; box.focus(); }
}

$('send').addEventListener('click', send);
$('box').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('addTask').addEventListener('click', async () => {
  const title = $('newTask').value.trim();
  if (!title) return;
  try { await api('task', { title, due: $('newDue').value }); $('newTask').value = ''; $('newDue').value = ''; await poll(); } catch {}
});
$('newTask').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addTask').click(); });
$('modes').addEventListener('click', async (e) => {
  const mode = e.target.dataset.mode;
  if (!mode) return;
  try { await api('mode', { mode }); await poll(); } catch {}
});
function go(tab) {
  for (const b of $('nav').children) b.classList.toggle('on', b.dataset.tab === tab);
  for (const id of ['chatPane', 'tasksPane', 'calPane', 'morePane']) $(id).classList.toggle('show', id === tab);
  if (tab === 'chatPane') { const feed = $('feed'); feed.scrollTop = feed.scrollHeight; }
  store.set('beatrix-tab', tab);
}
$('nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
$('calPrev').addEventListener('click', () => calStep(-1));
$('calNext').addEventListener('click', () => calStep(1));
$('calToday').addEventListener('click', () => { calSel = ymd(new Date()); calMonth = calSel.slice(0, 7); renderCal(); });
$('calAdd').addEventListener('click', async () => {
  const title = $('calNew').value.trim();
  if (!title) return;
  try { await api('task', { title, due: calSel }); $('calNew').value = ''; await poll(); } catch {}
});
$('calNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('calAdd').click(); });
document.addEventListener('focusout', () => setTimeout(() => { if (dirty && S && !editing()) render(); }, 50));
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
$('out').addEventListener('click', async (e) => {
  if (e.target.textContent !== 'Tap again to sign out') { e.target.textContent = 'Tap again to sign out'; setTimeout(() => { e.target.textContent = 'Sign out'; }, 4000); return; }
  e.target.textContent = 'Sign out';
  if (code) { code = ''; store.del('solring-code'); } else { try { await api('leave', {}); } catch {} }
  S = null; rev = ''; go('chatPane'); poll();
});
$('seats').addEventListener('click', async (e) => {
  const role = e.target.dataset.seat;
  if (!role) return;
  $('err').textContent = '';
  try {
    const res = await fetch('/api/enroll', { method: 'POST', headers: { authorization: 'Bearer ' + device, 'content-type': 'application/json' }, body: JSON.stringify({ role }) });
    if (!res.ok) $('err').textContent = (await res.json().catch(() => ({}))).error || 'That did not work. Try again.';
  } catch { $('err').textContent = 'No connection. Try again.'; }
  poll();
});
$('wipe').addEventListener('click', async (e) => {
  if (e.target.textContent !== 'Really wipe?') { e.target.textContent = 'Really wipe?'; setTimeout(() => { e.target.textContent = 'Wipe all'; }, 4000); return; }
  e.target.textContent = 'Wipe all';
  try { await api('admin/wipe', { confirm: 'wipe' }); await poll(); } catch {}
});

// The moderator's private link: /#k=CODE signs in once, then the code leaves the address bar.
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('k')) { code = hash.get('k'); store.set('solring-code', code); history.replaceState(null, '', location.pathname); }
const TABS = { tasks: 'tasksPane', calendar: 'calPane', more: 'morePane' };
go(TABS[hash.get('tab')] || 'chatPane');   // #tab=tasks | calendar | more opens there
poll();
</script>
</body>
</html>
