name: ios-release
# Signed App Store build, uploaded to App Store Connect (TestFlight). Run by hand; macOS minutes are free on a public repo.
on: { workflow_dispatch: {} }
jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: API key file
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - run: cd ios && xcodegen generate
      - name: Archive (signed by Xcode with the API key)
        run: |
          set -o pipefail
          echo "[$(date +%H:%M:%S)] archive, build $((100 + GITHUB_RUN_NUMBER))"
          cd ios && xcodebuild -project SolRing.xcodeproj -scheme SolRing -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Beatrix.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | grep -E "error|warning: .*sign|ARCHIVE|Signing|Provisioning|\*\*" | tail -40
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          echo "[$(date +%H:%M:%S)] export + upload"
          cd ios && xcodebuild -exportArchive -archivePath build/Beatrix.xcarchive -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | grep -v -i "authenticationKey" | tail -40
      - if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
