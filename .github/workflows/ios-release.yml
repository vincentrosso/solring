name: ios-release
# Signed App Store build, uploaded to App Store Connect (TestFlight). Run by hand; macOS minutes are free on a public repo.
# Signing is manual: the distribution certificate and the "Beatrix App Store" profile were made through the App Store
# Connect API (the API key's role cannot use Xcode's cloud signing) and live in repo secrets, never in this public repo.
on: { workflow_dispatch: {} }
jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Signing identity, profile and API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          echo "[$(date +%H:%M:%S)] keychain"
          KC="$RUNNER_TEMP/build.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$IOS_DIST_P12_B64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/' | tail -2
          echo "[$(date +%H:%M:%S)] profile"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_B64" | base64 -D > "$RUNNER_TEMP/p.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - run: cd ios && xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          echo "[$(date +%H:%M:%S)] archive, build $((100 + GITHUB_RUN_NUMBER))"
          cd ios && xcodebuild -project SolRing.xcodeproj -scheme SolRing -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Beatrix.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Beatrix App Store" CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) 2>&1 \
            | grep -E "error|ARCHIVE|\*\*" | tail -30
      - name: Export the .ipa
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>us.ndex.solring</key><string>Beatrix App Store</string></dict>
          </dict></plist>
          PLIST
          echo "[$(date +%H:%M:%S)] export"
          cd ios && xcodebuild -exportArchive -archivePath build/Beatrix.xcarchive -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath build/export 2>&1 | grep -E "error|EXPORT|\*\*" | tail -20
          ls -la build/export
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          echo "[$(date +%H:%M:%S)] upload"
          IPA=$(ls ios/build/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -15
      - if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/build.keychain-db" "$RUNNER_TEMP/p.mobileprovision"
